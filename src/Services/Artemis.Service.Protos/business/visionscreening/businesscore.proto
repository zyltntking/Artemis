syntax = "proto3";

option csharp_namespace = "Artemis.Service.Protos.Business.VisionScreen";

package Artemis.Service.Protos.Business.VisionScreen;
import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";
import "business/visionscreening/visionscreening.proto";
import "common.proto";

// 视力筛查核心业务服务
service VisionScreeningCoreService{

    // 教师绑定用户
	rpc BindTeacherUser(BindTeacherUserRequest) returns (AffectedResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/BindTeacherUser"
			body: "*"
		};
	}

	// 解绑教师用户
	rpc UnBindTeacherUser(UnBindTeacherUserRequest) returns (AffectedResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/UnBindTeacherUser"
			body: "*"
		};
	}

	// 生成任务
	rpc GeneratorTask(GeneratorTaskRequest) returns (AffectedResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/GeneratorTask"
			body: "*"
		};
	}

	// 生成任务目标
	rpc GenerateTaskTarget(GenerateTaskTargetRequest) returns (AffectedResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/GenerateTaskTarget"
			body: "*"
		};
	}

	// 生成筛查记录
	rpc GenerateRecord(GenerateRecordRequest) returns (AffectedResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/GenerateRecord"
			body: "*"
		};
	}

	// 查询根任务
	rpc FetchRootTask(FetchRootTaskRequest) returns (FetchRootTaskResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/FetchRootTask"
			body: "*"
		};
	}

	// 查询任务树
	rpc FetchTaskTree(FetchTaskTreeRequest) returns (FetchTaskTreeResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/FetchTaskTree"
			body: "*"
		};
	}

	// 查询任务单元目标
	rpc FetchTaskUnitTarget(FetchTaskUnitTargetRequest) returns (FetchTaskUnitTargetResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/FetchTaskUnitTarget"
			body: "*"
		};
	}

	// 任务状态变更
	rpc TaskStateChange(TaskStateChangeRequest) returns (AffectedResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/TaskStateChange"
			body: "*"
		};
	}

	// 添加验光仪数据
	rpc AddOptometerPacket(AddOptometerRequest) returns (AffectedResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/AddOptometer"
			body: "*"
		};
	}

	// 添加电子视力表数据
	rpc AddVisualChartPacket(AddVisualChartRequest) returns (AffectedResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/AddVisualChart"
			body: "*"
		};
	}

	// 获取大屏学生视力档案
	rpc GetLargeScreenRecord(GetLargeScreenRecordRequest) returns (GetLargeScreenRecordResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/GetLargeScreenRecord"
			body: "*"
		};
	}

	// 获取通知消息(多端通用)
	rpc FetchUserMessage(EmptyRequest) returns (FetchUserMessageResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/FetchUserMessage"
			body: "*"
		};
	}

	// 读取通知消息(多端通用)
	rpc ReadUserMessage(ReadUserMessageRequest) returns (ReadUserMessageResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/ReadUserMessage"
			body: "*"
		};
	}

	// 获取系统模块树
	rpc FetchSystemModuleTree(EmptyRequest) returns (FetchSystemModuleTreeResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/FetchSystemModuleTree"
			body: "*"
		};
	}

	// 获取系统模块树(经凭据过滤)
	rpc FetchClaimedSystemModuleTree(EmptyRequest) returns (FetchSystemModuleTreeResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/FetchClaimedSystemModuleTree"
			body: "*"
		};
	}

	// 请求批量PDF导出示例
    rpc MultiplePdfExportExample (ExportRequest) returns (stream ExportResponse){
		option (google.api.http) = {
			post: "/api/BusinessService/VisionScreeningCore/MultiplePdfExportExample"
			body: "*"
		};
	}
}

// 教师绑定用户请求
message BindTeacherUserRequest{
	// 用户标识
	// @required
	// @guid
	string UserId = 1;
	// 教师标识
	// @required
	// @guid
	string TeacherId = 2;
}

// 教师用户解绑请求
message UnBindTeacherUserRequest{
	// 用户标识
	// @required
	// @guid
	string UserId = 1;
}

// 任务绑定机构树
message TaskBindOrgnizationTreePacket{
	// 机构标识
	// @required
	// @guid
	string Id = 1;
	// 上级机构标识
	// @guid
	google.protobuf.StringValue ParentId = 2;
	// 机构名称
	// @required
	// @minLength(128)
	string Name = 3;
	// 机构编码
	// @required
	// @minLength(128)
	string Code = 4;
	// 机构类型
	// @required
	// @minLength(32)
	string Type = 5;
	// 机构状态
	// @required
	// @minLength(32)
	string Status = 6;
	// 机构行政区划编码
	// @required
	// @minLength(32)
	string DivisionCode = 7;
	// 下级机构
	// @required
	repeated TaskBindOrgnizationTreePacket Children = 8;
}

// 生成任务请求
message GeneratorTaskRequest{
	// 任务名称
	// @required
	// @minLength(128)
	string TaskName = 1;
	// 本次任务相关的机构信息
	// @required
	TaskBindOrgnizationTreePacket OrgnizationTree = 2;
	// 任务开始时间
	// @required
	// @datetime
	string StartTime = 3;
	// 任务结束时间
	// @required
	// @datetime
	string EndTime = 4;
}

// 生成任务目标请求
message GenerateTaskTargetRequest{
	// 任务标识
	// @required
	// @guid
	string TaskId = 1;
}

// 生成筛查记录请求
message GenerateRecordRequest{
	// 任务标识
	// @required
	// @guid
	string TaskId = 1;
}

// 查询根任务请求
message FetchRootTaskRequest{
	// 任务名称搜索值
	google.protobuf.StringValue TaskNameSearch = 1;
	// 任务计划开始时间
	// @datetime
	google.protobuf.StringValue StartTime =2;
	// 任务计划结束时间
	// @datetime
	google.protobuf.StringValue EndTime =3;
	// 任务状态
	google.protobuf.StringValue TaskState = 4;
	// 页码
	// @min(0)
	google.protobuf.Int32Value Page = 5;
	// 条目数
	// @min(0)
	google.protobuf.Int32Value Size = 6;
}

// 根任务信息
message RootTaskPacket{
	// 任务标识
	// @required
	// @guid
	string Id = 1;
	// 父任务标识
	// @guid
	google.protobuf.StringValue ParentId = 2;
	// 任务名称
	google.protobuf.StringValue TaskName = 3;
	// 任务编码
	// @required
	string TaskCode = 4;
	// 关联机构编码
	// @required
	string DesignCode = 5;
	// 任务归属
	// @required
	string TaskShip = 6;
	// 任务状态
	// @required
	string TaskState = 7;
	// 任务描述
	google.protobuf.StringValue Description = 8;
	// 计划开始时间
	// @datetime
	google.protobuf.StringValue StartTime = 9;
	// 计划结束时间
	// @datetime
	google.protobuf.StringValue EndTime = 10;
}

// 分页根任务信息数据包
message PagedRootTaskPacket{
	// 页码
	// @min(0)
	int32 Page = 1;
	// 条目数
	// @min(0)
	int32 Size = 2;
	// 数据总数
	// @min(0)
	int64 Total = 3;
	// 条件过滤后的数据量
	// @min(0)
	int64 Count = 4;
	// 角色用户信息数据
	// @required
	repeated RootTaskPacket Items = 5;
}

// 查询根任务响应
message FetchRootTaskResponse{
	// 状态码
	int32 Code = 1;
	// 是否成功
	bool Succeeded = 2;
	// 消息
	string Message = 3;
	// 错误
	// @exception
	google.protobuf.StringValue Error = 4;
	// 响应时间
	// @datetime
	string DateTime = 5;
	// 响应时间戳
	// @timestamp
	int64 Timestamp = 6;
	// 分页根任务信息
	// @required
	PagedRootTaskPacket Data = 7;
}

// 查询任务树请求
message FetchTaskTreeRequest{
	// 任务标识
	// @required
	// @guid
	string Id = 1;
}

// 任务单元数据包
message TaskUnitPacket{
	// 任务单元标识
	// @required
	// @guid
	string Id = 1;
	// 任务标识
	// @required
	// @guid
	string TaskId = 2;
	// 任务单元名称
	google.protobuf.StringValue UnitName = 3;
	// 任务单元编码
	// @required
	string UnitCode = 4;
	// 关联机构编码
	// @required
	string DesignCode = 5;
	// 任务单元状态
	// @required
	string TaskUnitState = 7;
	// 任务单元描述
	google.protobuf.StringValue Description = 8;
}

// 任务树数据包
message TaskTreePacket{
	// 任务标识
	// @required
	// @guid
	string Id = 1;
	// 父任务标识
	// @guid
	google.protobuf.StringValue ParentId = 2;
	// 任务名称
	google.protobuf.StringValue TaskName = 3;
	// 任务编码
	// @required
	string TaskCode = 4;
	// 关联机构编码
	// @required
	string DesignCode = 5;
	// 任务归属
	// @required
	string TaskShip = 6;
	// 任务状态
	// @required
	string TaskState = 7;
	// 任务描述
	google.protobuf.StringValue Description = 8;
	// 计划开始时间
	// @datetime
	google.protobuf.StringValue StartTime = 9;
	// 计划结束时间
	// @datetime
	google.protobuf.StringValue EndTime = 10;
	// 子任务
	repeated TaskTreePacket Children = 11;
	// 任务单元
	repeated TaskUnitPacket TaskUnits = 12;
}

// 查询任务树响应
message FetchTaskTreeResponse{
	// 状态码
	int32 Code = 1;
	// 是否成功
	bool Succeeded = 2;
	// 消息
	string Message = 3;
	// 错误
	// @exception
	google.protobuf.StringValue Error = 4;
	// 响应时间
	// @datetime
	string DateTime = 5;
	// 响应时间戳
	// @timestamp
	int64 Timestamp = 6;
	// 任务树信息
	// @required
	TaskTreePacket Data = 7;
}

// 查询任务单元目标请求
message FetchTaskUnitTargetRequest{
	// 任务单元
	// @required
	// @guid
	string Id = 1;
}

// 任务目标数据包
message TaskUnitTargetPacket{
	// 任务单元目标标识
	// @required
	// @guid
	string Id = 1;
	// 任务单元标识
	// @required
	// @guid
	string TaskUnitId = 2;
	// 任务单元名称
	google.protobuf.StringValue TargetName = 3;
	// 任务单元编号
	google.protobuf.StringValue TargetCode = 4;
	// 关联学生标识
	google.protobuf.StringValue BindingTag = 5;
	// 目标状态
	// @required
	string TaskState = 6;
	// 任务目标描述
	google.protobuf.StringValue Description = 7;
	// 任务目标执行时间
	google.protobuf.StringValue ExecuteTime = 8;
}

// 查询任务单元目标响应
message FetchTaskUnitTargetResponse{
	// 状态码
	int32 Code = 1;
	// 是否成功
	bool Succeeded = 2;
	// 消息
	string Message = 3;
	// 错误
	// @exception
	google.protobuf.StringValue Error = 4;
	// 响应时间
	// @datetime
	string DateTime = 5;
	// 响应时间戳
	// @timestamp
	int64 Timestamp = 6;
	// 任务目标数据
	// @required
	repeated TaskUnitTargetPacket Data = 7;
}


// 任务状态变更请求
message TaskStateChangeRequest{
	// 任务标识
	// @guid
	google.protobuf.StringValue TaskId = 1;
	// 任务标识
	// @guid
	google.protobuf.StringValue TaskUnitId = 2;
	// 任务标识
	// @guid
	google.protobuf.StringValue TaskUnitTargetId = 3;
	// 需要修改到的目标状态
	google.protobuf.StringValue State = 4;
}

// 验光仪数据包
message OptometerPacket{
	// 瞳距
	google.protobuf.DoubleValue PupilDistance = 1;
	// 左眼球镜
	google.protobuf.DoubleValue LeftSphere = 2;
	// 左眼等效球镜
	google.protobuf.DoubleValue LeftEquivalentSphere = 3;
	// 右眼球镜
	google.protobuf.DoubleValue RightSphere = 4;
	// 右眼等效球镜
	google.protobuf.DoubleValue RightEquivalentSphere = 5;
	// 左眼柱镜
	google.protobuf.DoubleValue LeftCylinder = 6;
	// 右眼柱镜
	google.protobuf.DoubleValue RightCylinder = 7;
	// 左眼轴位
	google.protobuf.DoubleValue LeftAxis = 8;
	// 右眼轴位
	google.protobuf.DoubleValue RightAxis = 9;
	// 左眼散光度数
	google.protobuf.DoubleValue LeftAstigmatism = 10;
	// 右眼散光度数
	google.protobuf.DoubleValue RightAstigmatism = 11;
	// 左眼角膜曲率r1(mm)
	google.protobuf.DoubleValue LeftCornealCurvatureR1 = 12;
	// 右眼角膜曲率r1(mm)
	google.protobuf.DoubleValue RightCornealCurvatureR1 = 13;
	// 左眼角膜曲率r1(d)
	google.protobuf.DoubleValue LeftCornealCurvatureD1 = 14;
	// 右眼角膜曲率r1(d)
	google.protobuf.DoubleValue RightCornealCurvatureD1 = 15;
	// 左眼角膜曲率r1角度
	google.protobuf.DoubleValue LeftCornealCurvatureAngle1 = 16;
	// 右眼角膜曲率r1角度
	google.protobuf.DoubleValue RightCornealCurvatureAngle1 = 17;
	// 左眼角膜曲率r2(mm)
	google.protobuf.DoubleValue LeftCornealCurvatureR2 = 18;
	// 右眼角膜曲率r2(mm)
	google.protobuf.DoubleValue RightCornealCurvatureR2 = 19;
	// 左眼角膜曲率r2(d)
	google.protobuf.DoubleValue LeftCornealCurvatureD2 = 20;
	// 右眼角膜曲率r2(d)
	google.protobuf.DoubleValue RightCornealCurvatureD2 = 21;
	// 左眼角膜曲率r2角度
	google.protobuf.DoubleValue LeftCornealCurvatureAngle2 = 22;
	// 右眼角膜曲率r2角度
	google.protobuf.DoubleValue RightCornealCurvatureAngle2 = 23;
	// 左眼角膜曲率平均值(mm)
	google.protobuf.DoubleValue LeftCornealCurvatureAverage = 24;
	// 右眼角膜曲率平均值(mm)
	google.protobuf.DoubleValue RightCornealCurvatureAverage = 25;
	// 左眼角膜曲率平均值(d)
	google.protobuf.DoubleValue LeftCornealCurvatureAverageD = 26;
	// 右眼角膜曲率平均值(d)
	google.protobuf.DoubleValue RightCornealCurvatureAverageD = 27;
	// 左眼角膜曲率散光度
	google.protobuf.DoubleValue LeftCornealCurvatureAstigmatism = 28;
	// 右眼角膜曲率散光度
	google.protobuf.DoubleValue RightCornealCurvatureAstigmatism = 29;
	// 筛查工作人员姓名
	google.protobuf.StringValue OptometerScreeningStuffName = 30;
	// 操作时间
	google.protobuf.StringValue OptometerOperationTime = 31;
	// 左眼瞳孔半径
	google.protobuf.DoubleValue LeftPupilRadius = 32;
	// 右眼瞳孔半径
	google.protobuf.DoubleValue RightPupilRadius = 33;
	// 左眼垂直方向斜视度数
	google.protobuf.DoubleValue LeftVerticalAxis = 34;
	// 右眼垂直方向斜视度数
	google.protobuf.DoubleValue RightVerticalAxis = 35;
	// 左眼水平方向斜视度数
	google.protobuf.DoubleValue LeftHorizontalAxis = 36;
	// 右眼水平方向斜视度数
	google.protobuf.DoubleValue RightHorizontalAxis = 37;
	// 左眼红光反射
	google.protobuf.StringValue LeftRedReflect = 38;
	// 右眼红光反射
	google.protobuf.StringValue RightRedReflect = 39;
}

// 添加验光仪数据请求
message AddOptometerRequest{
	// 记录标识
	// @required
	// @guid
	string RecordId = 1;
	// 验光仪数据包
	// @required
	OptometerPacket OptometerPacket = 2;
}

// 电子视力表数据包
message VisualChartPacket{
	// 左眼与视力表距离
	google.protobuf.DoubleValue LeftChartDistance = 1;
	// 右眼与视力表距离
	google.protobuf.DoubleValue RightChartDistance = 2;
	// 左眼裸眼视力
	google.protobuf.DoubleValue LeftNakedEyeVision = 3;
	// 右眼裸眼视力
	google.protobuf.DoubleValue RightNakedEyeVision = 4;
	// 是否佩戴眼镜
	bool IsWearGlasses = 5;
	// 左眼矫正视力
	google.protobuf.DoubleValue LeftCorrectedVision = 6;
	// 右眼矫正视力
	google.protobuf.DoubleValue RightCorrectedVision = 7;
	// 左眼远视力类型
	google.protobuf.StringValue LeftEyeHyperopiaType = 8;
	// 右眼远视力类型
	google.protobuf.StringValue RightEyeHyperopiaType = 9;
	// 左眼是否佩戴角膜塑形镜
	google.protobuf.BoolValue IsWareLeftOkLenses = 10;
	// 右眼是否佩戴角膜塑形镜
	google.protobuf.BoolValue IsWareRightOkLenses = 11;
	// 筛查工作人员姓名
	google.protobuf.StringValue ChartScreeningStuffName = 12;
	// 操作时间
	google.protobuf.StringValue ChartOperationTime = 13;
}

// 添加电子视力表数据请求
message AddVisualChartRequest{
	// 记录标识
	// @required
	// @guid
	string RecordId = 1;
	// 电子视力表数据包
	// @required
	VisualChartPacket VisualChartPacket = 2;
}

// 获取大屏学生视力档案请求
message GetLargeScreenRecordRequest{
	// 任务标识
	// @required
	// @guid
	string TaskId = 1;
	// 学生标识
	// @required
	// @guid
	string StudentId = 2;
}

// 大屏学生视力档案数据包
message LargeScreenRecordPacket {
	// 档案标识
	// @required
	// @guid
	string Id = 1;
	// 学生标识
	// @required
	// @guid
	string StudentId = 2;
	// 学生姓名
	google.protobuf.StringValue StudentName = 3;
	// 学生性别
	google.protobuf.StringValue Gender = 4;
	// 学生年龄
	google.protobuf.Int32Value Age = 5;
	// 学生班级
	google.protobuf.StringValue ClassName = 6;
	// 学生学校
	google.protobuf.StringValue SchoolName = 7;
	// 学生民族
	google.protobuf.StringValue Nation = 8;
	//学生年级
	google.protobuf.StringValue GradeName = 9;
	// 学生生日
	// @datetime
	google.protobuf.StringValue Birthday = 10;
	// 左眼球镜
	google.protobuf.DoubleValue LeftSphere = 11;
	// 右眼球镜
	google.protobuf.DoubleValue RightSphere = 12;
	// 左眼柱镜
	google.protobuf.DoubleValue LeftCylinder = 13;
	// 右眼柱镜
	google.protobuf.DoubleValue RightCylinder = 14;
	// 左眼等效球镜
	google.protobuf.DoubleValue LeftEquivalentSphere = 15;
	// 右眼等效球镜
	google.protobuf.DoubleValue RightEquivalentSphere = 16;
	// 左眼散光度数
	google.protobuf.DoubleValue LeftAstigmatism = 17;
	// 右眼散光度数
	google.protobuf.DoubleValue RightAstigmatism = 18;
	// 左眼裸眼视力
	google.protobuf.DoubleValue LeftNakedEyeVision = 19;
	// 右眼裸眼视力
	google.protobuf.DoubleValue RightNakedEyeVision = 20;
	// 左眼矫正视力
	google.protobuf.DoubleValue LeftCorrectedVision = 21;
	// 右眼矫正视力
	google.protobuf.DoubleValue RightCorrectedVision = 22;
	// 瞳距
	google.protobuf.DoubleValue PupilDistance = 23;
	// 检查时间
	// @datetime
	google.protobuf.StringValue CheckTime = 24;
	// 家长关系
	google.protobuf.StringValue ParentRelation = 25;
	// 联系地址
	google.protobuf.StringValue Address = 26;
	// 家长手机号
	google.protobuf.StringValue ParentMobile = 27;
	// 医生建议
	google.protobuf.StringValue DoctorAdvice = 28;
}

// 获取大屏学生视力档案响应
message GetLargeScreenRecordResponse{
	// 状态码
	int32 Code = 1;
	// 是否成功
	bool Succeeded = 2;
	// 消息
	string Message = 3;
	// 错误
	// @exception
	google.protobuf.StringValue Error = 4;
	// 响应时间
	// @datetime
	string DateTime = 5;
	// 响应时间戳
	// @timestamp
	int64 Timestamp = 6;
	// 大屏学生视力档案数据包
	// @required
	LargeScreenRecordPacket Data = 7;
}

// 获取通知消息数据包
message FetchUserMessagePacket{
	// 未读数量
	int32 NotReadCount = 1;
	// 消息列表
	repeated NotificationMessagePacket Messages = 2;

}

// 获取用户通知消息(多端通用)
message FetchUserMessageResponse{
	// 状态码
	int32 Code = 1;
	// 是否成功
	bool Succeeded = 2;
	// 消息
	string Message = 3;
	// 错误
	// @exception
	google.protobuf.StringValue Error = 4;
	// 响应时间
	// @datetime
	string DateTime = 5;
	// 响应时间戳
